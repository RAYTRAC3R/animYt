<!DOCTYPE html>
<html lang="en">
<head>
  <title>Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  .thumbnail {
    height: 256px;
  }
  
  .pfp{
	height: 512px;
  }
  </style>
</head>
<body>

<div class="container-fluid" style="margin:auto">
	<div class="row d-inline-flex">
		<div class="jumbotron" style="margin:5px">
		<h2 style="margin:30px">Creators</h2>
		{% for x in creators %}
			<div class="row" style="margin:10px">
				{% if x.thumbnail %}
					<div class="col" style="margin:auto"><a href="/creator/{{x.id}}"><img class="thumbnail float-left" src="{{ x.thumbnail.url }}"></a></div>
				{% else %}
					<div class="col" style="margin:auto"><a href="/creator/{{x.id}}"><img class="thumbnail float-left" src="https://placehold.co/256"></a></div>
				{% endif %}
				<div class="col" style="margin:auto"><a href="/creator/{{x.id}}"><p class="text-center" >{{ x }}</p></a></div>
				<div class="col" style="margin:auto"><a href="/creator/{{x.id}}"><p class="text-center" >{{ x.status }}</p></a></div>
			</div>
		{% endfor %}
		</div>
		<div class="jumbotron" style="margin:5px">
		<h2 style="margin:30px">Memes</h2>
		{% for x in memes %}
			<div class="row" style="margin:10px">
				{% if x.thumbnail %}
					<div class="col" style="margin:auto"><a href="/entry/{{x.id}}"><img class="thumbnail float-left" src="{{ x.thumbnail.url }}"></a></div>
				{% else %}
					<div class="col" style="margin:auto"><a href="/entry/{{x.id}}"><img class="thumbnail float-left" src="https://placehold.co/340x256"></a></div>
				{% endif %}
				<div class="col" style="margin:auto"><a href="/entry/{{x.id}}"><p class="text-center" >{{ x }}</p></a></div>
				<div class="col" style="margin:auto"><p class="text-center" >{{ x.category }}</p></div>
			</div>
		{% endfor %}
		</div>
	</div>
</div>

</body>
</html>
