<!DOCTYPE html>
<html lang="en">
<head>
  <title>Entry - {{ entry.entry_name }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  .fakeimg {
    height: 200px;
    background: #aaa;
  }
  </style>
</head>
<body>

<div class="container d-inline-flex" style="margin-top:30px">
	<div class="jumbotron">
		<div class="row">
			<div class="col">
			<img class="img-fluid float-left" src="{{ entry.thumbnail.url }}">
			</div>
		</div>
		<div class="row">
			<div class="table-responsive">
			<table class="table table-bordered table-hover">
			<tbody>
			  <tr>
				<th>ID #</th>
				<td>{{ entry.id }}</td>
			  </tr>
			  <tr>
				<th>Category</th>
				<td>{{ entry.category }}</td>
			  </tr>
			  <tr>
				<th>Title</th>
				<td>{{ entry.entry_name }}</td>
			  </tr>
			  <tr>
				<th>Animator</th>
				<<td><a href="/creator/{{entry.creator.id}}">{{ entry.creator }}</a></td>
			  </tr>
			  <tr>
				<th>Link</th>
				<td><a href="{{ entry.link }}">Video Link</a></td>
			  </tr>
			  <tr>
				<th>Original Upload Date</th>
				<<td>{{ entry.upload_date }}</td>
			  </tr>
			  <tr>
				<th>Addition Date</th>
				<<td>{{ entry.added_date }}</td>
			  </tr>
			</tbody>
			</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
