<!DOCTYPE html>
<html lang="en">
<head>
  <title>Creator - {{ creator.name }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  .thumbnail {
    height: 256px;
  }
  
  .pfp{
	height: 512px;
  }
  </style>
</head>
<body>

<div class="container-fluid" style="margin:auto">
	<div class="row d-inline-flex">
		<div class="col d-inline-flex">
			<div class="jumbotron">
				<div class="row">
					<div class="col" style="margin:10px">
					{% if creator.thumbnail %}
						<img class="pfp float-left" src="{{ creator.thumbnail }}">
					{% endif %}
					</div>
				</div>
				<div class="row" style="margin:15px">
					<div class="table-responsive">
					<table class="table table-bordered table-hover">
					<tbody>
					  <tr>
						<th>ID #</th>
						<td>{{ creator.id }}</td>
					  </tr>
					  <tr>
						<th>Name</th>
						<td>{{ creator.name }}</td>
					  </tr>
					  <tr>
						<th>Link</th>
						<td>
							<a href="{{ creator.link }}">Channel Link</a>
						</td>
					  </tr>
					  <tr>
						<th>Addition Date</th>
						<td>{{ creator.added_date }}</td>
					  </tr>
					</tbody>
					</table>
					</div>
				</div>
			</div>
		</div>
		<div class="jumbotron" style="margin:auto">
		{% for x in memes %}
			<div class="row" style="margin:10px">
				{% if x.thumbnail %}
					<div class="col" style="margin:auto"><a href="/entry/{{x.id}}"><img class="thumbnail float-left" src="{{ x.thumbnail }}"></a></div>
				{% endif %}
				<div class="col" style="margin:auto"><a href="/entry/{{x.id}}">{{ x }}</a></div>
				<div class="col" style="margin:auto"><p>{{ x.category }}</p></div>
			</div>
		{% endfor %}
		</div>
	</div>
</div>

</body>
</html>
